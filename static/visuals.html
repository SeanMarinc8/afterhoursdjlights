<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERHOURS VJ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white;font:13px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;left:20px;top:20px;background:#09090be8;border:1px solid #ffffff25;padding:16px;width:min(350px,calc(100vw - 40px));border-radius:10px;transition:opacity .2s}.ui.hidden{opacity:0;pointer-events:none}h1{font-size:19px;letter-spacing:.15em;margin:0 0 4px}small{color:#aaa}button,select,input{accent-color:#ff303b}button,select{background:#18181c;color:white;border:1px solid #555;padding:9px;border-radius:5px;cursor:pointer}button:hover{border-color:#ff3b45}.buttons{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.buttons button{font-size:11px}label{display:flex;justify-content:space-between;gap:12px;margin:8px 0}label input{width:155px}.status{font-size:11px;color:#aaa;margin-top:10px}.bottom{position:fixed;right:15px;bottom:12px;color:#ffffff70;font-size:11px;letter-spacing:.12em}kbd{background:#333;padding:1px 4px;border-radius:3px}
</style></head><body><canvas id="c"></canvas><section class="ui" id="ui"><h1>AFTERHOURS <span style="color:#ff3544">VJ</span></h1><small>LIVE WAREHOUSE VISUAL ENGINE</small><div class="buttons"><button id="start">🎤 START AUDIO</button><button id="full">⛶ FULLSCREEN</button><button id="hide">HIDE UI (H)</button></div><div class="buttons" id="scenes"></div><label>Intensity <input id="intensity" type="range" min="0" max="100" value="72"></label><label>Strobe <input id="strobe" type="range" min="0" max="100" value="15"></label><label>Sensitivity <input id="sensitivity" type="range" min="20" max="300" value="130"></label><label>Auto scenes <input id="auto" type="checkbox"></label><div class="status" id="status">Audio inactive · Demo animation active</div><div class="status">1–5 scenes · SPACE flash · F fullscreen · H controls · D auto</div></section><div class="bottom">AFTERHOURS // LIVE</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),status=document.getElementById('status');
const sceneNames=['REDLINE','TUNNEL','STROBE GRID','RAVE RINGS','MONOLITH'];let scene=0,auto=false,flash=0,lastBeat=0,lastScene=0,bass=0,mid=0,treble=0,level=0,phase=0,started=false,analyser=null,frequency=null,audioContext=null,stream=null;
const $=id=>document.getElementById(id),val=id=>Number($(id).value)/100;
const sceneButtons=sceneNames.map((name,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+name;b.onclick=()=>setScene(i);$('scenes').appendChild(b);return b;});
function setScene(i){scene=i;lastScene=performance.now();sceneButtons.forEach((b,j)=>b.style.borderColor=j===i?'#ff3544':'#555');}setScene(0);
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);}addEventListener('resize',resize);resize();
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});audioContext=new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();analyser=audioContext.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.73;frequency=new Uint8Array(analyser.frequencyBinCount);audioContext.createMediaStreamSource(stream).connect(analyser);started=true;status.textContent='MIC LIVE · Bass-reactive mode';$('start').textContent='✓ AUDIO LIVE';}catch(e){status.textContent='Mic unavailable: '+e.message+' · Demo still works';}};
$('full').onclick=()=>document.documentElement.requestFullscreen?.();$('hide').onclick=()=>{$('ui').classList.toggle('hidden');};$('auto').onchange=e=>auto=e.target.checked;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key>='1'&&e.key<='5')setScene(+e.key-1);if(e.code==='Space'){e.preventDefault();flash=1;}if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='h')$('ui').classList.toggle('hidden');if(e.key.toLowerCase()==='d'){$('auto').checked=!$('auto').checked;auto=$('auto').checked;}});
function readAudio(t){if(analyser){analyser.getByteFrequencyData(frequency);const hz=audioContext.sampleRate/analyser.fftSize;const avg=(lo,hi)=>{let sum=0,n=0;for(let i=Math.max(0,Math.floor(lo/hz));i<Math.min(frequency.length,Math.ceil(hi/hz));i++){sum+=frequency[i];n++;}return n?sum/n/255:0;};const sens=val('sensitivity');bass=Math.min(1,avg(35,160)*sens);mid=Math.min(1,avg(160,2000)*sens);treble=Math.min(1,avg(2000,9000)*sens);}else{bass=.22+.14*(1+Math.sin(t*2.6))*.5;mid=.2+.1*Math.sin(t*1.5)**2;treble=.18;}level=bass*.65+mid*.25+treble*.1;phase+=.007+level*.018;}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function poly(points,color,width=1,fill=null){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur;}function unglow(){ctx.shadowBlur=0;}
function drawRedline(w,h,t,p){const cx=w/2,cy=h/2;for(let i=0;i<25;i++){const y=h*(i/24),spread=(.06+i/24*.52)*w;line(cx-spread,y,cx+spread,y,`rgba(255,25,45,${.04+p*.13})`,1);}glow('#f12',20+30*p);for(let i=0;i<13;i++){const z=((i/13+phase*.32)%1),r=20+z*z*Math.max(w,h)*.85;const rot=phase*.3;const pts=[];for(let j=0;j<4;j++){const a=rot+j*Math.PI/2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r*.67]);}poly(pts,`rgba(255,${Math.round(15+45*z)},${Math.round(35+30*z)},${.18+z*.65})`,1+z*3);}unglow();}
function drawTunnel(w,h,t,p){const cx=w/2,cy=h/2;glow('#00d5ff',15+20*p);for(let i=0;i<20;i++){const z=((i/20+phase*.18)%1),r=10+z*z*Math.max(w,h)*.8;const pts=[];for(let j=0;j<6;j++){const a=j*Math.PI/3+phase*.14;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r*.6]);}poly(pts,`rgba(${Math.floor(30+100*p)},${Math.floor(100+130*z)},255,${.15+z*.7})`,1+z*2);}unglow();}
function drawGrid(w,h,t,p){const horizon=h*.44;glow('#ff2460',12+25*p);for(let i=-20;i<=20;i++)line(w/2,horizon,w/2+i*w*.12,h,`rgba(255,30,90,${.1+p*.6})`,1.5);for(let i=1;i<20;i++){const z=i/20;const y=horizon+(z*z)*(h-horizon);line(0,y,w,y,`rgba(255,30,90,${.12+z*.6})`,1+z);}unglow();const size=Math.min(w,h)*(.12+p*.06);ctx.save();ctx.translate(w/2,horizon-45);ctx.rotate(phase*.2);poly([[-size,-size],[size,-size],[size,size],[-size,size]],'#fff',3);ctx.restore();}
function drawRings(w,h,t,p){const cx=w/2,cy=h/2;for(let i=0;i<16;i++){const z=((i/16+phase*.26)%1);ctx.beginPath();ctx.ellipse(cx,cy,30+z*z*w*.62,30+z*z*h*.62,Math.sin(phase*.1)*.18,0,Math.PI*2);glow(i%2?'#fc1a35':'#f7f7f7',10+18*p);ctx.strokeStyle=i%2?`rgba(255,20,55,${.15+z*.7})`:`rgba(255,255,255,${.08+z*.7})`;ctx.lineWidth=1+z*6;ctx.stroke();}unglow();}
function drawMonolith(w,h,t,p){const cx=w/2,cy=h/2;const height=h*(.45+p*.3),width=Math.min(w*.17,190);glow('#ff1935',40*p+8);ctx.fillStyle='#ff2037';ctx.fillRect(cx-width/2,cy-height/2,width,height);unglow();ctx.fillStyle='#050505';ctx.fillRect(cx-width/2+5,cy-height/2+5,width-10,height-10);for(let i=0;i<28;i++){const y=cy-height/2+i*height/28;line(cx-width/2,y,cx+width/2,y,`rgba(255,40,50,${.05+p*.3})`,1);}const n=40;for(let i=0;i<n;i++){const x=(i+.5)/n*w,hh=(.06+Math.abs(Math.sin(i*91.2+t*2))*p*.25)*h;line(x,h-hh,x,h,`rgba(255,35,55,${.3+p*.5})`,Math.max(2,w/n*.4));}}
function frame(ms){const t=ms/1000,w=innerWidth,h=innerHeight;readAudio(t);ctx.fillStyle='#020204';ctx.fillRect(0,0,w,h);const p=Math.min(1,level*val('intensity')*2.3);if(scene===0)drawRedline(w,h,t,p);if(scene===1)drawTunnel(w,h,t,p);if(scene===2)drawGrid(w,h,t,p);if(scene===3)drawRings(w,h,t,p);if(scene===4)drawMonolith(w,h,t,p);
if(bass>.64&&ms-lastBeat>270){lastBeat=ms;flash=Math.max(flash,Math.min(.55,bass*.45)*val('strobe'));}if(auto&&ms-lastScene>14000)setScene((scene+1)%5);
if(flash>.008){ctx.fillStyle=`rgba(255,255,255,${Math.min(.9,flash)})`;ctx.fillRect(0,0,w,h);flash*=.77;}ctx.fillStyle=`rgba(255,255,255,${.025+p*.035})`;for(let i=0;i<80;i++){const x=(Math.sin(i*17.31+t*.17)*.5+.5)*w,y=(Math.cos(i*42.19+t*.13)*.5+.5)*h;ctx.fillRect(x,y,1.3,1.3);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script></body></html>
